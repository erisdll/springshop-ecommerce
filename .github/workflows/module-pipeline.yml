name: CI/CD Pipeline for ${{ inputs.service_name }}

on:
  workflow_call:
    description: |
      This workflow builds and deploys a specific microservice in the SpringShop application.
      It is triggered by the main CI/CD pipeline when changes are detected in the respective service.
    inputs:
      service_name:
        required: true
        type: string
    secrets:
      DOCKERHUB_USER:
        required: true
      DOCKERHUB_TOKEN:
        required: true

jobs:

  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build and Test with Maven
        run: mvn clean verify -pl services/${{ inputs.service_name }} -am

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -f services/${{ inputs.service_name }}/Dockerfile \
          -t ${{ secrets.DOCKERHUB_USER }}/springshop-${{ inputs.service_name }}:latest \
          .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKERHUB_USER }}/springshop-${{ inputs.service_name }}:latest

      - name: Simulate Deploy
        run: echo "Deploying ${{ inputs.service_name }}..."
