name: CI/CD Pipeline for Microservice

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string

jobs:
  ci-cd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Build with Maven
        run: mvn clean install -pl services/${{ inputs.service_name }} -am

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -f services/${{ inputs.service_name }}/Dockerfile \
          -t ${{ vars.DOCKERHUB_USERNAME }}/springshop-${{ inputs.service_name }}:latest \
          .

      - name: Push Docker Image
        run: |
          docker push ${{ vars.DOCKERHUB_USERNAME }}/springshop-${{ inputs.service_name }}:latest

      - name: Simulate Deploy
        run: echo "Deploying ${{ inputs.service_name }}..."
