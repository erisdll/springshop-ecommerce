name: Springshop CI/CD Pipeline

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      gateway: ${{ steps.filter.outputs.gateway }}
      inventory: ${{ steps.filter.outputs.inventory }}
      notification: ${{ steps.filter.outputs.notification }}
      order: ${{ steps.filter.outputs.order }}
      payment: ${{ steps.filter.outputs.payment }}
      product: ${{ steps.filter.outputs.product }}
      user: ${{ steps.filter.outputs.user }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Changed Services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            gateway:
              - 'services/gateway-service/**'
            inventory:
              - 'services/inventory-service/**'
            notification:
              - 'services/notification-service/**'
            order:
              - 'services/order-service/**'
            payment:
              - 'services/payment-service/**'
            product:
              - 'services/product-service/**'
            user:
              - 'services/user-service/**'

      - name: Show Changed Services
        run: |
          echo "Changed services:"
          [[ "${{ steps.filter.outputs.gateway }}" == "true" ]] && echo "gateway-service"
          [[ "${{ steps.filter.outputs.inventory }}" == "true" ]] && echo "inventory-service"
          [[ "${{ steps.filter.outputs.notification }}" == "true" ]] && echo "notification-service"
          [[ "${{ steps.filter.outputs.order }}" == "true" ]] && echo "order-service"
          [[ "${{ steps.filter.outputs.payment }}" == "true" ]] && echo "payment-service"
          [[ "${{ steps.filter.outputs.product }}" == "true" ]] && echo "product-service"
          [[ "${{ steps.filter.outputs.user }}" == "true" ]] && echo "user-service"

  build-services:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, inventory, notification, order, payment, product, user]
    if: ${{ needs.detect-changes.outputs[matrix.service] == 'true' }}
    uses: ./.github/workflows/module-pipeline.yml
    with:
      service_name: ${{ matrix.service }}-service
    secrets:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}