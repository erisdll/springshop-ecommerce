server:
  port: ${SERVER_PORT:8087}

jwt:
  secret: "ChangeThisSecretKeyToAStrongOneOfAtLeast32Chars!"
  expiration-millis: 3600000

spring:

  application:
    name: auth-service

  cloud:
    config:
      enabled: false

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:springshop}
    username: ${POSTGRES_USER:springshop}
    password: ${POSTGRES_PASSWORD:springshop123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 30000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:springshop123}
      timeout: 60000

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:springshop}
    password: ${RABBITMQ_PASSWORD:springshop123}
    virtual-host: ${RABBITMQ_VHOST:/}

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE
    com.erika.springshop: DEBUG

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

customer:
  service:
    url: http://localhost:8080/v1/