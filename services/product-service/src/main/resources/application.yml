spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/springshop
    username: ${POSTGRES_USER:springshop}
    password: ${POSTGRES_PASSWORD:springshop123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:springshop123}
      timeout: 60000

  profiles:
    active: default

  application:
    name: product-service

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method