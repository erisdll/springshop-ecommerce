networks:
  springshop-network:
    driver: bridge

volumes:
  postgres-data:
  mongo-data:
  redis-data:

secrets:
  postgres-password:
    file: ./secrets/postgres-password.txt
  mongo-password:
    file: ./secrets/mongo-password.txt
  redis.conf:
    file: ./secrets/redis.conf
  rabbitmq-password:
    file: ./secrets/rabbitmq-password.txt