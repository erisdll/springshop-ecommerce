services:

  # =======================
  # DATABASES & INFRA
  # =======================
  postgres:
    image: postgres:17
    container_name: springshop-postgres
    restart: always
    environment:
      POSTGRES_USER: springshop
      POSTGRES_DB: springshop
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - postgres-password
    networks:
      - springshop-network
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "springshop" ]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8
    container_name: springshop-mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: springshop
      MONGO_INITDB_ROOT_PASSWORD_FILE: /run/secrets/mongo-password
    secrets:
      - mongo-password
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - springshop-network
    healthcheck:
      test:
        [ "CMD-SHELL", "echo 'db.runCommand(\"ping\").ok' | mongo --quiet -u springshop -p $(cat /run/secrets/mongo-password) --authenticationDatabase admin" ]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    container_name: springshop-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: springshop
      RABBITMQ_DEFAULT_PASS: ./run/secrets/rabbitmq-password
    secrets:
      - rabbitmq-password
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # UI de gerenciamento
    networks:
      - springshop-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    container_name: springshop-redis
    restart: always
    command: [ "redis-server", "/run/secrets/redis.conf" ]
    secrets:
      - redis.conf
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - springshop-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # =======================
  # GATEWAY
  # =======================
  api-gateway:
    build:
      context: .
      dockerfile: services/gateway-service/Dockerfile
    container_name: springshop-api-gateway
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - EUREKA_CLIENT_ENABLED=false
    depends_on:
      - product-service
      - order-service
      - payment-service
      - inventory-service
      - notification-service
      - user-service
    networks:
      - springshop-network

  # =======================
  # MICROSERVICES
  # =======================
  product-service:
    build:
      context: .
      dockerfile: services/product-service/Dockerfile
    container_name: springshop-product-service
    ports:
      - "8081:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=postgres
      - REDIS_HOST=redis
    depends_on:
      - postgres
      - redis
    networks:
      - springshop-network

  order-service:
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    container_name: springshop-order-service
    ports:
      - "8082:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=postgres
    depends_on:
      - postgres
    networks:
      - springshop-network

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    container_name: springshop-payment-service
    ports:
      - "8083:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=postgres
    depends_on:
      - postgres
    networks:
      - springshop-network

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    container_name: springshop-inventory-service
    ports:
      - "8084:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=mongodb
    depends_on:
      - mongodb
    networks:
      - springshop-network

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    container_name: springshop-notification-service
    ports:
      - "8085:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - MQ_HOST=rabbitmq
    depends_on:
      - rabbitmq
    networks:
      - springshop-network

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: springshop-user-service
    ports:
      - "8086:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
      - DB_HOST=postgres
    depends_on:
      - postgres
    networks:
      - springshop-network

